<!-- کانتینر چت‌باکس شناور -->
<div id="chat-widget" style="position:fixed;bottom:20px;right:20px;background:#fff;border:1px solid #ccc;padding:12px;width:300px;border-radius:10px;box-shadow:0 4px 15px rgba(0,0,0,0.15);z-index:9999;font-family:Tahoma,sans-serif;direction:rtl;box-sizing:border-box;">
  <div id="chat-header" style="font-weight:bold;padding-bottom:8px;border-bottom:1px solid #eee;cursor:move;user-select:none;display:flex;justify-content:space-between;align-items:center;">
    <span>🎧 پشتیبانی آنلاین</span>
  </div>
  
  <div id="chat-status" style="font-size:11px;color:gray;margin:6px 0;">در حال راه‌اندازی...</div>
  
  <div id="chat-box" style="height:180px;overflow-y:auto;border:1px solid #f0f0f0;padding:8px;margin-bottom:8px;background:#fafafa;border-radius:6px;display:flex;flex-direction:column;gap:6px;"></div>
  
  <div style="display:flex;gap:5px;">
    <input type="text" id="chat-input" placeholder="پیام خود را بنویسید..." style="flex:1;padding:6px;border:1px solid #ccc;border-radius:4px;outline:none;font-size:13px;" disabled />
    <button onclick="sendMsg()" id="chat-btn" style="padding:6px 12px;background:#007bff;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px;" disabled>ارسال</button>
  </div>
</div>

<script>
  // آدرس ورکر کلودفلر خود را اینجا جایگزین کنید
let WORKER_URL = "https://worker-name.workers.dev/";
// حذف اسلش اضافه از انتهای آدرس در صورت وجود
WORKER_URL = WORKER_URL.replace(/\/+$/, "");
  
  let userId = localStorage.getItem("chat_user_id");
  let lastMsgCount = 0;

  // پخش صدای اعلان دلنشین با Web Audio API (بدون نیاز به فایل خارجی)
  function playNotificationSound() {
    try {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sine';
      // فرکانس صدا (حالت دو تنه‌ لطیف)
      osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // نت D5
      osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1); // نت A5

      gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 0.35);
    } catch (e) {
      console.log("پخش صدا امکان‌پذیر نیست:", e);
    }
  }

  // ۱. قابلیت Drag & Drop برای جابه‌جایی چت‌باکس با ماوس
  const widget = document.getElementById("chat-widget");
  const header = document.getElementById("chat-header");
  let isDragging = false, offsetX, offsetY;

  header.onmousedown = (e) => {
    isDragging = true;
    offsetX = e.clientX - widget.offsetLeft;
    offsetY = e.clientY - widget.offsetTop;
  };
  document.onmousemove = (e) => {
    if (isDragging) {
      widget.style.left = (e.clientX - offsetX) + "px";
      widget.style.top = (e.clientY - offsetY) + "px";
      widget.style.bottom = "auto"; 
      widget.style.right = "auto";
    }
  };
  document.onmouseup = () => isDragging = false;

  // ۲. ارسال پیام با کلید Enter
  document.getElementById("chat-input").addEventListener("keydown", function(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMsg();
    }
  });

  // ۳. راه‌اندازی چت
  async function initChat() {
    if (!userId) {
      try {
        const res = await fetch(`${WORKER_URL}/start`);
        const data = await res.json();
        userId = data.userId;
        localStorage.setItem("chat_user_id", userId);
      } catch (err) {
        console.error("خطا در برقراری ارتباط با ورکر:", err);
      }
    }
    setInterval(poll, 1500);
    poll();
  }

  // ۴. دریافت پیام‌ها و وضعیت (Polling)
  async function poll() {
    if (!userId) return;
    try {
      const res = await fetch(`${WORKER_URL}/poll?userId=${userId}`);
      const data = await res.json();

      const statusDiv = document.getElementById("chat-status");
      const input = document.getElementById("chat-input");
      const btn = document.getElementById("chat-btn");

      if (data.status === "accepted") {
        statusDiv.innerText = "🟢 در حال گفت‌وگو با پشتیبانی";
        statusDiv.style.color = "green";
        input.disabled = false;
        btn.disabled = false;
      } else {
        statusDiv.innerText = "🟡 منتظر تایید پشتیبان...";
        statusDiv.style.color = "#d97706";
      }

      // بروزرسانی پیام‌ها و پخش صدا در صورت دریافت پیام جدید
      if (data.messages && data.messages.length !== lastMsgCount) {
        // چک می‌کنیم اگر پیام جدید از سمت پشتیبان (admin) باشد، صدا پخش شود
        if (lastMsgCount > 0) {
          const lastMsg = data.messages[data.messages.length - 1];
          if (lastMsg && lastMsg.sender === "admin") {
            playNotificationSound();
          }
        }

        const box = document.getElementById("chat-box");
        box.innerHTML = "";
        data.messages.forEach(m => {
          const isUser = m.sender === 'user';
          box.innerHTML += `
            <div style="text-align:${isUser ? 'right' : 'left'};">
              <span style="display:inline-block;background:${isUser ? '#007bff' : '#e9ecef'};color:${isUser ? '#fff' : '#333'};padding:5px 9px;border-radius:8px;font-size:12px;max-width:80%;word-break:break-word;">
                ${m.text}
              </span>
            </div>
          `;
        });
        box.scrollTop = box.scrollHeight;
        lastMsgCount = data.messages.length;
      }
    } catch (err) {
      console.error("خطا در دریافت اطلاعات:", err);
    }
  }

  // ۵. ارسال پیام
  async function sendMsg() {
    const input = document.getElementById("chat-input");
    const text = input.value.trim();
    if (!text || input.disabled) return;
    
    input.value = "";

    try {
      await fetch(`${WORKER_URL}/send`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ userId, text })
      });
      poll();
    } catch (err) {
      console.error("خطا در ارسال پیام:", err);
    }
  }

  initChat();
</script>
